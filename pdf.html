<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locofo Catalog — Spec sheet export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/pdf.css" />
</head>
<body class="pdf-body">
  <div class="pdf-toolbar no-print">
    <a href="index.html">← Back to products</a>
    <button type="button" class="btn-print" id="printBtn">Print / Save PDF</button>
  </div>

  <div id="pdfSheets"></div>

  <p class="empty-notice no-print" id="emptyNotice" hidden>
    Your shortlist is empty — showing the MH900 demo spec. Add products from the catalog before exporting a buyer pack.
  </p>

  <script src="js/products.js"></script>
  <script src="js/shortlist.js"></script>
  <script src="js/pdf-render.js"></script>
  <script>
    document.getElementById('printBtn')?.addEventListener('click', () => window.print());
  </script>
</body>
</html>
